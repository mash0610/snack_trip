<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景 -->
  <rect width="512" height="512" rx="112" fill="#003d5c"/>

  <!-- 海グラデーション -->
  <rect x="0" y="350" width="512" height="162" fill="#00a8d6" opacity="0.3"/>
  <path d="M0,390 C70,368 140,415 210,390 C280,365 350,415 420,390 C460,375 490,395 512,385 L512,512 L0,512 Z" fill="#40e0d0" opacity="0.4"/>
  <path d="M0,425 C90,405 180,445 270,425 C360,405 440,440 512,425 L512,512 L0,512 Z" fill="#5eecd8" opacity="0.45"/>

  <!-- ハイボールグラス本体 -->
  <path d="M176,180 L196,360 L316,360 L336,180 Z" fill="#ffffff" opacity="0.18"/>
  <path d="M176,180 L196,360 L316,360 L336,180 Z" fill="url(#glass)"/>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#e8f6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="whisky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d4920a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- ウイスキー液体 -->
  <path d="M193,268 L199,360 L313,360 L319,268 Z" fill="url(#whisky)"/>

  <!-- 炭酸の泡 -->
  <circle cx="230" cy="320" r="5" fill="#ffffff" opacity="0.55"/>
  <circle cx="258" cy="300" r="4" fill="#ffffff" opacity="0.45"/>
  <circle cx="280" cy="315" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="245" cy="280" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="295" cy="290" r="4" fill="#ffffff" opacity="0.45"/>
  <circle cx="220" cy="290" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="270" cy="270" r="3" fill="#ffffff" opacity="0.35"/>

  <!-- グラスの縁（上） -->
  <rect x="172" y="172" width="168" height="16" rx="8" fill="#ffffff" opacity="0.7"/>

  <!-- グラスの底 -->
  <rect x="190" y="352" width="132" height="14" rx="7" fill="#ffffff" opacity="0.6"/>

  <!-- グラスの光沢ライン -->
  <rect x="188" y="190" width="8" height="150" rx="4" fill="#ffffff" opacity="0.25"/>

  <!-- ストローなし -->

  <!-- レモンスライス -->
  <ellipse cx="175" cy="175" rx="32" ry="32" fill="#f9d56e"/>
  <ellipse cx="175" cy="175" rx="24" ry="24" fill="#f5c842"/>
  <!-- レモンの皮 -->
  <path d="M175,143 Q185,160 175,175 Q165,160 175,143 Z" fill="#f9d56e" opacity="0.6"/>
  <path d="M143,175 Q160,165 175,175 Q160,185 143,175 Z" fill="#f9d56e" opacity="0.6"/>
  <path d="M175,207 Q165,190 175,175 Q185,190 175,207 Z" fill="#f9d56e" opacity="0.6"/>
  <path d="M207,175 Q190,185 175,175 Q190,165 207,175 Z" fill="#f9d56e" opacity="0.6"/>
  <ellipse cx="175" cy="175" rx="6" ry="6" fill="#f9d56e" opacity="0.8"/>
  <!-- レモン輪郭 -->
  <ellipse cx="175" cy="175" rx="32" ry="32" fill="none" stroke="#e8a800" stroke-width="3" opacity="0.5"/>

  <!-- キラキラ -->
  <circle cx="380" cy="130" r="5" fill="#f9d56e" opacity="0.85"/>
  <circle cx="408" cy="200" r="3" fill="#5eecd8" opacity="0.8"/>
  <circle cx="100" cy="160" r="4" fill="#f9d56e" opacity="0.7"/>
  <circle cx="120" cy="240" r="3" fill="#5eecd8" opacity="0.7"/>
  <circle cx="395" cy="280" r="4" fill="#f9d56e" opacity="0.6"/>

  <!-- テキストなし（ホーム画面のラベルに任せる） -->
</svg>
